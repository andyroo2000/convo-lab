name: Deploy ConvoLab (Production)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable static frontend image tag (main-<full-sha>)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^main-[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be an immutable main-<full-sha> tag"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to droplet
        env:
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_GH_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GHCR_ACTOR: ${{ github.actor }}
        run: |
          {
            printf 'IMAGE_TAG=%q\n' "$DEPLOY_IMAGE_TAG"
            printf 'GH_PAT=%q\n' "$DEPLOY_GH_PAT"
            printf 'GHCR_TOKEN=%q\n' "$DEPLOY_GHCR_TOKEN"
            printf 'GHCR_ACTOR=%q\n' "$DEPLOY_GHCR_ACTOR"
            cat << 'ENDSSH'
            set -euo pipefail

            echo "🚀 Starting ConvoLab production deployment..."
            COMPOSE="docker compose -p convolab-prod -f docker-compose.prod.yml --env-file .env.production"
            RUNTIME_DIR="/opt/convolab-runtime"
            ROUTER_DIR="$RUNTIME_DIR/prod-router"
            ACTIVE_COLOR_FILE="$RUNTIME_DIR/prod-active-color"
            ROUTER_CONFIG="$ROUTER_DIR/default.conf"
            ROUTER_TEMPLATE="deploy/prod-router.conf.template"

            cd /opt/convolab

            git config credential.helper store
            echo "https://${GH_PAT}@github.com" > ~/.git-credentials
            chmod 600 ~/.git-credentials

            echo "📦 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main

            mkdir -p "$ROUTER_DIR"
            export CONVOLAB_FRONTEND_IMAGE_TAG="$IMAGE_TAG"
            export CONVOLAB_ROUTER_DIR="$ROUTER_DIR"

            if grep -q '^CONVOLAB_FRONTEND_IMAGE_TAG=' .env.production; then
              sed -i "s#^CONVOLAB_FRONTEND_IMAGE_TAG=.*#CONVOLAB_FRONTEND_IMAGE_TAG=$IMAGE_TAG#g" .env.production
            else
              echo "CONVOLAB_FRONTEND_IMAGE_TAG=$IMAGE_TAG" >> .env.production
            fi

            if grep -q '^CONVOLAB_ROUTER_DIR=' .env.production; then
              sed -i "s#^CONVOLAB_ROUTER_DIR=.*#CONVOLAB_ROUTER_DIR=$ROUTER_DIR#g" .env.production
            else
              echo "CONVOLAB_ROUTER_DIR=$ROUTER_DIR" >> .env.production
            fi
            sed -i '/^CONVOLAB_ROUTER_CONFIG=/d' .env.production

            render_router_config() {
              color="$1"
              upstream="convolab-server-$color"
              if [ ! -s "$ROUTER_TEMPLATE" ]; then
                echo "❌ Router template is missing or empty: $ROUTER_TEMPLATE"
                exit 1
              fi
              sed \
                -e "s#__UPSTREAM_SERVICE__#$upstream#g" \
                "$ROUTER_TEMPLATE" > "$ROUTER_CONFIG.tmp"
              if ! grep -q "$upstream" "$ROUTER_CONFIG.tmp"; then
                echo "❌ Generated router config does not reference $upstream"
                exit 1
              fi
              if [ -e "$ROUTER_CONFIG" ]; then
                # Preserve the bind-mounted file inode so the running router sees updates.
                cat "$ROUTER_CONFIG.tmp" > "$ROUTER_CONFIG"
                rm "$ROUTER_CONFIG.tmp"
              else
                mv "$ROUTER_CONFIG.tmp" "$ROUTER_CONFIG"
              fi
            }

            write_active_color() {
              color="$1"
              mkdir -p "$(dirname "$ACTIVE_COLOR_FILE")"
              printf '%s\n' "$color" > "$ACTIVE_COLOR_FILE.tmp"
              mv "$ACTIVE_COLOR_FILE.tmp" "$ACTIVE_COLOR_FILE"
            }

            wait_for_container_health() {
              container="$1"
              for i in {1..60}; do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo "missing")
                echo "$container health: $status"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
                if [ "$status" = "missing" ]; then
                  echo "⚠️ $container does not exist yet; waiting..."
                fi
                if [ -z "$status" ]; then
                  echo "❌ $container has no Docker healthcheck; cannot health-gate it."
                  return 1
                fi
                if [ "$status" = "unhealthy" ]; then
                  echo "❌ $container reported unhealthy. Recent logs:"
                  docker logs --tail=200 "$container" || true
                  return 1
                fi
                sleep 5
              done
              echo "❌ $container did not become healthy in time. Recent logs:"
              docker logs --tail=200 "$container" || true
              return 1
            }

            verify_public_health() {
              for i in {1..20}; do
                if curl --fail --silent --show-error \
                  --connect-timeout 5 \
                  --max-time 15 \
                  https://convo-lab.com/health > /dev/null; then
                  echo "✅ Public production health check passed."
                  return 0
                fi
                echo "Public health attempt $i/20 failed; retrying in 3s..."
                sleep 3
              done
              return 1
            }

            verify_public_static_frontend() {
              for i in {1..20}; do
                if ./deploy/smoke-static-frontend.sh https://convo-lab.com; then
                  echo "✅ Public static frontend contract passed."
                  return 0
                fi
                echo "Static frontend contract attempt $i/20 failed; waiting for router convergence..."
                sleep 3
              done
              return 1
            }

            verify_public_learning_os_browser_route() (
              cookie_jar="$(mktemp)"
              response_body="$(mktemp)"
              trap 'rm -f "$cookie_jar" "$response_body"' EXIT

              csrf_status="$(curl --silent --show-error \
                --cookie-jar "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Origin: https://convo-lab.com' \
                https://convo-lab.com/sanctum/csrf-cookie)"
              if [ "$csrf_status" != 204 ]; then
                echo "Learning OS CSRF bootstrap returned HTTP $csrf_status."
                cat "$response_body"
                return 1
              fi
              if ! awk '$6 == "XSRF-TOKEN" { found = 1 } END { exit found ? 0 : 1 }' "$cookie_jar"; then
                echo "Learning OS CSRF bootstrap did not set XSRF-TOKEN."
                return 1
              fi
              if ! awk '$6 == "learning_os_session" { found = 1 } END { exit found ? 0 : 1 }' "$cookie_jar"; then
                echo "Learning OS CSRF bootstrap did not set learning_os_session."
                return 1
              fi
              encoded_xsrf_token="$(
                awk '$6 == "XSRF-TOKEN" { value = $7 } END { print value }' "$cookie_jar"
              )"
              # Laravel percent-encodes the base64 token, so each percent escape is a complete byte.
              xsrf_token="$(printf '%b' "${encoded_xsrf_token//%/\\x}")"
              if [ -z "$xsrf_token" ]; then
                echo "Learning OS CSRF bootstrap returned an empty XSRF token."
                return 1
              fi

              account_status="$(curl --silent --show-error \
                --cookie "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header 'Origin: https://convo-lab.com' \
                https://convo-lab.com/api/convolab/auth/me)"
              if [ "$account_status" != 401 ]; then
                echo "Unauthenticated direct account probe returned HTTP $account_status."
                cat "$response_body"
                return 1
              fi
              if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                echo "Direct account probe did not return the Learning OS auth contract."
                cat "$response_body"
                return 1
              fi

              oauth_headers="$(curl --max-time 10 --silent --show-error \
                --dump-header - \
                --output /dev/null \
                --cookie "$cookie_jar" \
                --header 'Origin: https://convo-lab.com' \
                https://convo-lab.com/api/convolab/browser/auth/google)"
              oauth_location="$(printf '%s\n' "$oauth_headers" \
                | sed -n 's/^location: //Ip' | tr -d '\r' | tail -1)"
              if ! oauth_failure="$(bash \
                .github/scripts/validate-google-oauth-redirect.sh \
                "$oauth_location" \
                'https%3A%2F%2Fconvo-lab.com%2Fapi%2Fconvolab%2Fbrowser%2Fauth%2Fgoogle%2Fcallback' \
                true 2>&1)"; then
                echo "Direct Google OAuth redirect failed: $oauth_failure"
                return 1
              fi

              browser_auth_status="$(curl --silent --show-error \
                --cookie "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header 'Origin: https://convo-lab.com' \
                https://convo-lab.com/api/convolab/browser/auth/me)"
              if [ "$browser_auth_status" != 401 ]; then
                echo "Unauthenticated direct browser auth probe returned HTTP $browser_auth_status."
                cat "$response_body"
                return 1
              fi
              if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                echo "Direct browser auth probe did not return the Learning OS auth contract."
                cat "$response_body"
                return 1
              fi
              password_reset_status="$(curl --silent --show-error \
                --request POST \
                --cookie "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --header 'Origin: https://convo-lab.com' \
                --header "X-XSRF-TOKEN: $xsrf_token" \
                --data '{"email":"not-an-email"}' \
                https://convo-lab.com/api/auth/password/forgot)"
              if [ "$password_reset_status" != 422 ]; then
                echo "Direct password reset route probe returned HTTP $password_reset_status instead of 422."
                cat "$response_body"
                return 1
              fi
              if ! grep -q '"email"' "$response_body"; then
                echo "Direct password reset route did not return the Learning OS validation contract."
                cat "$response_body"
                return 1
              fi

              verification_status="$(curl --silent --show-error \
                --request POST \
                --cookie "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --header 'Origin: https://convo-lab.com' \
                --header "X-XSRF-TOKEN: $xsrf_token" \
                --data '{"token":"invalid"}' \
                https://convo-lab.com/api/convolab/browser/auth/verification)"
              if [ "$verification_status" != 422 ]; then
                echo "Direct verification route probe returned HTTP $verification_status instead of 422."
                cat "$response_body"
                return 1
              fi

              invite_claim_status="$(curl --silent --show-error \
                --request POST \
                --cookie "$cookie_jar" \
                --output "$response_body" \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --header 'Origin: https://convo-lab.com' \
                --header "X-XSRF-TOKEN: $xsrf_token" \
                --data '{"inviteCode":"ABC123"}' \
                https://convo-lab.com/api/convolab/browser/auth/google/invite)"
              if [ "$invite_claim_status" != 401 ]; then
                echo "Direct invite claim route probe returned HTTP $invite_claim_status instead of 401."
                cat "$response_body"
                return 1
              fi

                episode_status="$(curl --silent --show-error \
                  --cookie "$cookie_jar" \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --header 'Accept: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  https://convo-lab.com/api/convolab/episodes)"
                if [ "$episode_status" != 401 ]; then
                  echo "Unauthenticated direct episode probe returned HTTP $episode_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                  echo "Direct episode probe did not return the Learning OS auth contract."
                  cat "$response_body"
                  return 1
                fi

                course_status="$(curl --silent --show-error \
                  --cookie "$cookie_jar" \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --header 'Accept: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  https://convo-lab.com/api/convolab/courses)"
                if [ "$course_status" != 401 ]; then
                  echo "Unauthenticated direct course probe returned HTTP $course_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                  echo "Direct course probe did not return the Learning OS auth contract."
                  cat "$response_body"
                  return 1
                fi

                script_status="$(curl --silent --show-error \
                  --cookie "$cookie_jar" \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --header 'Accept: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  https://convo-lab.com/api/convolab/scripts/job/00000000-0000-4000-8000-000000000000)"
                if [ "$script_status" != 401 ]; then
                  echo "Unauthenticated direct script probe returned HTTP $script_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                  echo "Direct script probe did not return the Learning OS auth contract."
                  cat "$response_body"
                  return 1
                fi

                for generation_probe in \
                  'dialogue|https://convo-lab.com/api/convolab/dialogue/job/00000000-0000-4000-8000-000000000000' \
                  'audio|https://convo-lab.com/api/convolab/audio/job/00000000-0000-4000-8000-000000000000' \
                  'images|https://convo-lab.com/api/convolab/images/job/00000000-0000-4000-8000-000000000000' \
                  'legacy-dialogue|https://convo-lab.com/api/dialogue/job/00000000-0000-4000-8000-000000000000' \
                  'legacy-audio|https://convo-lab.com/api/audio/job/00000000-0000-4000-8000-000000000000' \
                  'legacy-images|https://convo-lab.com/api/images/job/00000000-0000-4000-8000-000000000000'
                do
                  generation_label="${generation_probe%%|*}"
                  generation_url="${generation_probe#*|}"
                  generation_status="$(curl --silent --show-error \
                    --cookie "$cookie_jar" \
                    --output "$response_body" \
                    --write-out '%{http_code}' \
                    --header 'Accept: application/json' \
                    --header 'Origin: https://convo-lab.com' \
                    "$generation_url")"
                  if [ "$generation_status" != 401 ]; then
                    echo "Unauthenticated direct generation probe ($generation_label) returned HTTP $generation_status."
                    cat "$response_body"
                    return 1
                  fi
                  if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                    echo "Direct generation probe ($generation_label) did not return the Learning OS auth contract."
                    cat "$response_body"
                    return 1
                  fi
                done

                for study_probe in \
                  'canonical|https://convo-lab.com/api/study/overview' \
                  'daily-audio|https://convo-lab.com/api/daily-audio-practice'
                do
                  study_label="${study_probe%%|*}"
                  study_url="${study_probe#*|}"
                  study_status="$(curl --silent --show-error \
                    --cookie "$cookie_jar" \
                    --output "$response_body" \
                    --write-out '%{http_code}' \
                    --header 'Accept: application/json' \
                    --header 'Origin: https://convo-lab.com' \
                    "$study_url")"
                  if [ "$study_status" != 401 ]; then
                    echo "Unauthenticated direct Study probe ($study_label) returned HTTP $study_status."
                    cat "$response_body"
                    return 1
                  fi
                  if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                    echo "Direct Study probe ($study_label) did not return the Learning OS auth contract."
                    cat "$response_body"
                    return 1
                  fi
                done

                for retired_express_url in \
                  'https://convo-lab.com/api/auth/csrf' \
                  'https://convo-lab.com/api/learning-os/study/overview' \
                  'https://convo-lab.com/api/learning-os/study/daily-audio-practice'
                do
                  retired_express_status="$(curl --silent --show-error \
                    --cookie "$cookie_jar" \
                    --output "$response_body" \
                    --write-out '%{http_code}' \
                    --header 'Accept: application/json' \
                    --header 'Origin: https://convo-lab.com' \
                    "$retired_express_url")"
                  if [ "$retired_express_status" != 404 ]; then
                    echo "Retired Express API route returned HTTP $retired_express_status."
                    cat "$response_body"
                    return 1
                  fi
                  if ! grep -q '"error":{"message":"Not found"}' "$response_body"; then
                    echo "Retired Express API route did not return the not-found contract."
                    cat "$response_body"
                    return 1
                  fi
                done

                avatar_status="$(curl --silent --show-error \
                  --dump-header "$response_body" \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  https://convo-lab.com/api/avatars/voices/ja-shohei.jpg)"
                if [ "$avatar_status" != 302 ]; then
                  echo "Direct Learning OS avatar probe returned HTTP $avatar_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -Eiq '^x-powered-by: PHP/' "$response_body"; then
                  echo "Direct Learning OS avatar probe did not reach PHP."
                  cat "$response_body"
                  return 1
                fi

                tool_audio_status="$(curl --silent --show-error \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Accept: application/json' \
                  --header 'Content-Type: application/json' \
                  --data '{"paths":["/tools-audio/japanese-time/google-kento-professional/time/minute/44.mp3"]}' \
                  https://convo-lab.com/api/tools-audio/signed-urls)"
                if [ "$tool_audio_status" != 200 ]; then
                  echo "Direct Learning OS tool-audio probe returned HTTP $tool_audio_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"mode":"signed"' "$response_body"; then
                  echo "Direct Learning OS tool-audio probe did not return signed URLs."
                  cat "$response_body"
                  return 1
                fi

                feature_flags_status="$(curl --silent --show-error \
                  --cookie "$cookie_jar" \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --header 'Accept: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  https://convo-lab.com/api/feature-flags)"
                if [ "$feature_flags_status" != 401 ]; then
                  echo "Unauthenticated direct feature flags probe returned HTTP $feature_flags_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                  echo "Direct feature flags probe did not return the Learning OS auth contract."
                  cat "$response_body"
                  return 1
                fi

                analytics_status="$(curl --silent --show-error \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header 'Accept: application/json' \
                  --header 'Content-Type: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  --data '{"tool":"deployment","event":"smoke","context":"app","properties":{"source":"convolab-production"}}' \
                  https://convo-lab.com/api/convolab/browser/tools/analytics)"
                if [ "$analytics_status" != 204 ] || [ -s "$response_body" ]; then
                  echo "Direct Learning OS browser analytics probe returned HTTP $analytics_status."
                  cat "$response_body"
                  return 1
                fi

                admin_status="$(curl --silent --show-error \
                  --cookie "$cookie_jar" \
                  --output "$response_body" \
                  --write-out '%{http_code}' \
                  --header 'Accept: application/json' \
                  --header 'Origin: https://convo-lab.com' \
                  https://convo-lab.com/api/convolab/admin/stats)"
                if [ "$admin_status" != 401 ]; then
                  echo "Unauthenticated direct admin probe returned HTTP $admin_status."
                  cat "$response_body"
                  return 1
                fi
                if ! grep -q '"message":"Unauthenticated."' "$response_body"; then
                  echo "Direct admin probe did not return the Learning OS auth contract."
                  cat "$response_body"
                  return 1
                fi

              echo "✅ Learning OS direct browser routes passed!"
            )

            reload_router() {
              router_running="$(docker inspect -f '{{.State.Running}}' convolab-server 2>/dev/null || echo "false")"
              if [ "$router_running" = "true" ]; then
                router_config_dir_source="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d"}}{{.Source}}{{end}}{{end}}' convolab-server 2>/dev/null || true)"
                if [ "$router_config_dir_source" = "$ROUTER_DIR" ]; then
                  docker exec convolab-server nginx -t
                  docker exec convolab-server nginx -s reload
                else
                  echo "♻️ Recreating router to bind the config directory..."
                  $COMPOSE up -d --no-deps --force-recreate router
                  wait_for_container_health convolab-server
                fi
              else
                $COMPOSE up -d --no-deps router
                wait_for_container_health convolab-server
              fi
            }

            rollback_router() {
              previous_color="$1"
              echo "↩️ Rolling router back to $previous_color..."
              render_router_config "$previous_color"
              if ! reload_router; then
                echo "❌ Router rollback reload failed; production may still be on the failed color."
                return 1
              fi
              if ! verify_public_health; then
                echo "❌ Public health is still failing after rollback to $previous_color."
                return 1
              fi
              write_active_color "$previous_color"
            }

            active_color="blue"
            if [ -s "$ACTIVE_COLOR_FILE" ]; then
              active_color="$(cat "$ACTIVE_COLOR_FILE")"
            fi
            case "$active_color" in
              blue) inactive_color="green" ;;
              green) inactive_color="blue" ;;
              *)
                echo "❌ Invalid active color '$active_color' in $ACTIVE_COLOR_FILE"
                exit 1
                ;;
            esac

            echo "Active color: $active_color"
            echo "Deploying inactive color: $inactive_color"

            echo "🧹 Removing stale inactive web color before memory check if present..."
            if docker inspect "convolab-server-$inactive_color" >/dev/null 2>&1; then
              docker rm -f "convolab-server-$inactive_color" || {
                echo "❌ Failed to remove stale inactive color convolab-server-$inactive_color."
                exit 1
              }
            fi

            echo "🧹 Pruning unused Docker data before memory check and image pull..."
            docker system prune -af

            available_mb="$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)"
            echo "Available memory: ${available_mb}MB"
            # Keep enough headroom for the small inactive frontend color, image
            # extraction, router work, and an automatic rollback.
            if [ "$available_mb" -lt 1024 ]; then
              echo "❌ Refusing blue/green deploy with less than 1024MB available memory."
              exit 1
            fi

            echo "🔐 Logging in to GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            echo "🐋 Pulling Docker images (tag: $IMAGE_TAG)..."
            timeout 600 $COMPOSE pull router "server-$inactive_color"

            echo "🧱 Ensuring Learning OS Postgres stays running..."
            $COMPOSE up -d postgres

            echo "🚦 Starting convolab-server-$inactive_color..."
            $COMPOSE up -d --no-deps "server-$inactive_color"
            wait_for_container_health "convolab-server-$inactive_color"

            router_role="$(docker inspect -f '{{index .Config.Labels "convolab.role"}}' convolab-server 2>/dev/null || true)"
            if [ "$router_role" = "router" ]; then
              echo "🔀 Reloading router to $inactive_color..."
              render_router_config "$inactive_color"
              reload_router
            elif docker inspect convolab-server >/dev/null 2>&1; then
              echo "❌ convolab-server exists without the expected router role."
              echo "Refusing to replace an unexpected production container automatically."
              echo "🧹 Removing the inactive app started for this aborted deploy..."
              if ! docker rm -f "convolab-server-$inactive_color"; then
                echo "⚠️ Failed to remove convolab-server-$inactive_color; manual cleanup is required."
              fi
              exit 1
            else
              echo "🔀 Starting router for new production stack..."
              render_router_config "$inactive_color"
              $COMPOSE up -d --no-deps router
              if ! wait_for_container_health convolab-server; then
                echo "❌ Router failed to become healthy on the fresh production stack."
                exit 1
              fi
            fi

            if ! verify_public_health \
              || ! verify_public_static_frontend \
              || ! verify_public_learning_os_browser_route; then
              echo "❌ Public verification failed after switching to $inactive_color."
              if ! rollback_router "$active_color"; then
                echo "❌ Rollback also failed; manual intervention is required."
              fi
              exit 1
            fi

            write_active_color "$inactive_color"

            echo "🛑 Stopping old web color for rollback if present..."
            if docker inspect "convolab-server-$active_color" >/dev/null 2>&1; then
              if ! docker stop "convolab-server-$active_color"; then
                echo "⚠️ Failed to stop old color convolab-server-$active_color; it may still be running."
              fi
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            $COMPOSE ps
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Production blue/green deployment complete!"
          ENDSSH
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DROPLET_USER@$DROPLET_HOST" bash -s

      - name: Health check
        run: |
          echo "🏥 Running health check..."

          for i in {1..20}; do
            response="$(curl --fail --silent --show-error https://convo-lab.com/health || true)"
            if echo "$response" | grep -q '"frontend":true'; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i/20 failed, retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 20 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
