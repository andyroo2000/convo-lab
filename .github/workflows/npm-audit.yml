name: NPM Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit committed dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'

      - name: Reject high or critical dependency advisories
        run: npm run audit:dependencies

  tooling-contracts:
    name: Verify dependency and image tooling contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency audit workflow contract
        run: node --test .github/scripts/dependency-audit.test.mjs

      - name: Verify PWA image generation contract
        run: npm run test:icons --workspace=client
