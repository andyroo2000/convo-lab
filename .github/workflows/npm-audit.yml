name: NPM Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    name: Audit committed dependency lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'

      - name: Reject high or critical dependency advisories
        run: npm run audit:dependencies
