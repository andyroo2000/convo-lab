name: Frontend Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Type, lint, format, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'

      - name: Install from committed lockfile
        run: npm ci

      - name: Verify installed Git hook contract
        run: node --test .github/scripts/npm-install-runtime.node-test.mjs

      - name: Type-check workspaces
        run: npm run type-check

      - name: Lint workspaces
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run full client suite and enforce coverage thresholds
        run: npm run test:coverage --workspace=client -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml

      - name: Upload test diagnostics on failure
        if: ${{ failure() && hashFiles('client/test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics-${{ github.run_id }}
          path: |
            client/test-results
            client/coverage
          retention-days: 7
