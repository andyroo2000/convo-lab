networks:
  health-network:
    external: true
    name: health-tracker_health-network

services:
  server-stage:
    image: ghcr.io/andyroo2000/convolab-frontend:${CONVOLAB_FRONTEND_IMAGE_TAG:-latest}
    container_name: convolab-server-stage
    restart: unless-stopped
    ports:
      - '3002:3001'
    networks:
      health-network:
        aliases:
          - convolab-server-stage
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
