server {
  listen 3001;
  listen [::]:3001;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/generated-routes.conf;

  location = /health {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"status":"ok","checks":{"frontend":true}}';
  }

  location = /index.html {
    return 308 /;
  }

  location = /api {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 404 '{"error":{"message":"Not found"}}';
  }

  location ^~ /api/ {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 404 '{"error":{"message":"Not found"}}';
  }

  location = /study-media {
    return 404;
  }

  location ^~ /study-media/ {
    return 404;
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location ~ ^/(workbox-[^/]+\.js|manifest\.(webmanifest|json))$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /__spa/ {
    internal;
  }

  location / {
    try_files $uri @not_found_spa;
    add_header Cache-Control "public, max-age=3600";
  }

  location @not_found_spa {
    try_files /__spa/not-found.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }
}
